name: Fejlsøg opskrifter
on:
  push:
    branches: [claude/project-thread-65bcls]
jobs:
  se:
    runs-on: ubuntu-latest
    steps:
      - name: Se hvordan madsiderne beskriver opskrifter
        run: |
          python3 - <<'PY'
          import re, urllib.request
          for url in ["https://www.valdemarsro.dk/frikadeller/", "https://www.arla.dk/opskrifter/oksefrikadeller/",
                      "https://madensverden.dk/kaalpande/"]:
              req = urllib.request.Request(url, headers={"User-Agent": "Tilbudshenter/0.1 (madplan; https://github.com/simonhansen8/Tilbudshenter)", "Accept": "text/html"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      page = r.read(3_000_000).decode("utf-8", "replace"); status = r.status
              except Exception as e:
                  print(url, "FEJL", e); continue
              print("=====", url, status, len(page))
              print("title:", re.findall(r"<title>(.*?)</title>", page, re.S)[:1])
              for m in re.finditer(r"<script[^>]*ld\+json[^>]*>", page, re.I): print("ldjson tag:", m.group(0)[:200], page[m.end():m.end()+300].replace("\n"," "))
              print("itemprop recipeIngredient:", len(re.findall(r'itemprop="?recipeIngredient', page)), "ingredients:", len(re.findall(r'itemprop="?ingredients', page)))
              print("Recipe mentions:", len(re.findall(r'"Recipe"', page)), "schema.org/Recipe:", len(re.findall(r'schema.org/Recipe', page)))
              print("__NEXT_DATA__:", "__NEXT_DATA__" in page, "recipeIngredient anywhere:", page.count("recipeIngredient"))
              i = page.find("recipeIngredient")
              if i >= 0: print("context:", page[max(0,i-400):i+300].replace("\n"," "))
          PY
