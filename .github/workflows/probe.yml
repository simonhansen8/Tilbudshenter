# Midlertidig: afprøver madsider. Fjernes før PR.
name: Afprøv madsider
on:
  push:
    branches: [claude/project-thread-65bcls]
    paths: [".probe/**", ".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . -q && python .probe/probe2.py .probe/sites2.txt
