[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tilbudshenter"
version = "0.1.0"
description = "Scanner danske tilbudsaviser og finder de bedste tilbud"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tilbudshenter = "tilbudshenter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tilbudshenter.data" = ["*.json", "*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
